kvmd:
    gpio:
        drivers:
            hks401:
                type: hks401
                socket: /run/hks401d.sock
                timeout: 1.0
                state_poll: 0.25

        scheme:
            hks401_pc1:
                driver: hks401
                pin: pc1
                mode: output
                switch: true
                pulse:
                    delay: 0

            hks401_pc2:
                driver: hks401
                pin: pc2
                mode: output
                switch: true
                pulse:
                    delay: 0

            hks401_pc3:
                driver: hks401
                pin: pc3
                mode: output
                switch: true
                pulse:
                    delay: 0

            hks401_pc4:
                driver: hks401
                pin: pc4
                mode: output
                switch: true
                pulse:
                    delay: 0

            hks401_autoscan:
                driver: hks401
                pin: autoscan
                mode: output
                switch: true
                pulse:
                    delay: 0

            hks401_mouse:
                driver: hks401
                pin: mouse
                mode: output
                switch: true
                pulse:
                    delay: 0

            hks401_audio_follow:
                driver: hks401
                pin: audio_follow
                mode: output
                switch: true
                pulse:
                    delay: 0

            hks401_auto_detect: {driver: hks401, pin: auto_detect, mode: output, switch: true, pulse: {delay: 0}}

            hks401_km_passthrough: {driver: hks401, pin: km_passthrough, mode: output, switch: true, pulse: {delay: 0}}
            hks401_km_compatible:  {driver: hks401, pin: km_compatible,  mode: output, switch: true, pulse: {delay: 0}}

            hks401_buzzer: {driver: hks401, pin: buzzer, mode: output, switch: true, pulse: {delay: 0}}

            # Multi-state controls: one switch per choice, rendered as
            # mutually exclusive buttons by hks401.css.
            hks401_light_off:       {driver: hks401, pin: lighting_off,       mode: output, switch: true, pulse: {delay: 0}}
            hks401_light_indicator: {driver: hks401, pin: lighting_indicator, mode: output, switch: true, pulse: {delay: 0}}
            hks401_light_marquee:   {driver: hks401, pin: lighting_marquee,   mode: output, switch: true, pulse: {delay: 0}}
            hks401_light_breathing: {driver: hks401, pin: lighting_breathing, mode: output, switch: true, pulse: {delay: 0}}

            hks401_fan_off:  {driver: hks401, pin: fan_off,  mode: output, switch: true, pulse: {delay: 0}}
            hks401_fan_auto: {driver: hks401, pin: fan_auto, mode: output, switch: true, pulse: {delay: 0}}
            hks401_fan_low:  {driver: hks401, pin: fan_low,  mode: output, switch: true, pulse: {delay: 0}}
            hks401_fan_high: {driver: hks401, pin: fan_high, mode: output, switch: true, pulse: {delay: 0}}

            hks401_audio_pc1: {driver: hks401, pin: audio_pc1, mode: output, switch: true, pulse: {delay: 0}}
            hks401_audio_pc2: {driver: hks401, pin: audio_pc2, mode: output, switch: true, pulse: {delay: 0}}
            hks401_audio_pc3: {driver: hks401, pin: audio_pc3, mode: output, switch: true, pulse: {delay: 0}}
            hks401_audio_pc4: {driver: hks401, pin: audio_pc4, mode: output, switch: true, pulse: {delay: 0}}

            # Independent per-PC Ethernet enables (0x09 mask bits).
            hks401_net_pc1: {driver: hks401, pin: net_pc1, mode: output, switch: true, pulse: {delay: 0}}
            hks401_net_pc2: {driver: hks401, pin: net_pc2, mode: output, switch: true, pulse: {delay: 0}}
            hks401_net_pc3: {driver: hks401, pin: net_pc3, mode: output, switch: true, pulse: {delay: 0}}
            hks401_net_pc4: {driver: hks401, pin: net_pc4, mode: output, switch: true, pulse: {delay: 0}}

            # Momentary "next" buttons.
            hks401_pc_next:    {driver: hks401, pin: pc_next,    mode: output, switch: false, pulse: {delay: 0.1}}
            hks401_audio_next: {driver: hks401, pin: audio_next, mode: output, switch: false, pulse: {delay: 0.1}}

            # Hidden LEDs; hks401.css outlines the Ethernet button of the 0x89 focus PC.
            hks401_netfocus_pc1: {driver: hks401, pin: net_focus_pc1, mode: input}
            hks401_netfocus_pc2: {driver: hks401, pin: net_focus_pc2, mode: input}
            hks401_netfocus_pc3: {driver: hks401, pin: net_focus_pc3, mode: input}
            hks401_netfocus_pc4: {driver: hks401, pin: net_focus_pc4, mode: input}

        view:
            header:
                title: TESmart
            # [] starts a new table so each section gets its own column widths.
            table:
                - ["#HKS401-M24 Input"]
                - ["hks401_pc1|", "hks401_pc2|"]
                - ["hks401_pc3|", "hks401_pc4|"]
                - ["hks401_pc_next|Next PC"]
                - []
                - ["#Controls"]
                - ["hks401_autoscan|Auto Scan", "hks401_buzzer|Buzzer"]
                - ["hks401_mouse|Mouse Wheel", "hks401_audio_follow|Audio Follow"]
                - ["hks401_auto_detect|Auto Detect"]
                - []
                - ["#KM Mode", "hks401_km_passthrough|", "hks401_km_compatible|"]
                - ["#Lighting", "hks401_light_off|", "hks401_light_indicator|", "hks401_light_marquee|", "hks401_light_breathing|"]
                - ["#Fan", "hks401_fan_off|", "hks401_fan_auto|", "hks401_fan_low|", "hks401_fan_high|"]
                - ["#Audio", "hks401_audio_pc1|", "hks401_audio_pc2|", "hks401_audio_pc3|", "hks401_audio_pc4|", "hks401_audio_next|Next"]
                - ["#Ethernet", "hks401_net_pc1|confirm|", "hks401_net_pc2|confirm|", "hks401_net_pc3|confirm|", "hks401_net_pc4|confirm|"]
                - ["#", "hks401_netfocus_pc1|green", "hks401_netfocus_pc2|green", "hks401_netfocus_pc3|green", "hks401_netfocus_pc4|green"]
